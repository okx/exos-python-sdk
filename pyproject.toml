[build-system]
requires = ["hatchling>=1.26,<1.28"]
build-backend = "hatchling.build"

[project]
name = "exos-python-sdk"
version = "1.0.0"
description = "Python SDK for synchronous exchangeOS REST, EIP-712 signing, and WebSocket APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExchangeOS SDK Contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "msgpack>=1.0,<2",
  "eth-abi>=5.0.1,<6",
  "eth-hash[pycryptodome]>=0.7,<1",
  "eth-keys>=0.7,<1",
  "eth-utils>=5,<6",
  "websockets>=13,<16",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<8",
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "build>=1.2,<2",
  "twine>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/exos_python_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["/.claude", "/security-audit-*.md", "/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
markers = [
  "live: calls a deployed ExchangeOS API and is skipped unless explicitly enabled",
]

[tool.coverage.run]
branch = true
source = ["exos_python_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["exos_python_sdk"]
